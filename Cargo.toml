[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"

[workspace.dependencies]
anyhow = "=1.0.100"
arrow = { version = "=60.0.0", default-features = false }
arrow-ipc = "=60.0.0"
base64 = "=0.22.1"
clap = { version = "=4.5.51", features = ["derive"] }
csv = "1"
duckdb = { version = "=1.20000.1", features = ["bundled", "extensions-full"] }
flate2 = "=1.1.11"
hex = "=0.4.3"
log = "=0.4.35"
memmap2 = "=0.9.9"
nsh-core = { version = "=0.5.1", default-features = false }
nsh-base = { version = "=0.5.1", default-features = false }
ryu = "1"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = { version = "=1.0.145", features = ["float_roundtrip"] }
sha2 = "=0.10.9"
tempfile = "=3.23.0"
thiserror = "=2.0.17"
tokio = { version = "=1.48.0", features = ["io-std", "io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
uuid = { version = "=1.18.1", features = ["serde", "v4"] }

[profile.release]
lto = "thin"
codegen-units = 1
