[package]
name = "omo-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
test-support = []

[dependencies]
arrow.workspace = true
arrow-ipc.workspace = true
base64.workspace = true
duckdb.workspace = true
flate2 = { workspace = true, features = ["zlib-rs"] }
hex.workspace = true
memmap2.workspace = true
omo-protocol = { path = "../omo-protocol" }
colorgrad = { version = "0.9.0", features = ["preset"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }
mvt-reader = "2.5.0"
png = { version = "0.18.1", features = ["zlib-rs"] }
brotli = { version = "9.1.3", default-features = false, features = ["std"] }
geo-types = { version = "0.7.19", default-features = false }
ruzstd = "0.9.1"
tiny-skia = "0.12.0"
ttf-parser = { version = "0.25.1", default-features = false, features = ["std"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tempfile.workspace = true
thiserror.workspace = true

[[test]]
name = "results"
path = "tests/results.rs"

[[test]]
name = "bootstrap"
path = "tests/bootstrap.rs"
required-features = ["test-support"]

[[test]]
name = "export"
path = "tests/export.rs"
required-features = ["test-support"]

[[test]]
name = "export_v2"
path = "tests/export_v2.rs"
required-features = ["test-support"]

[[test]]
name = "series_schema"
path = "tests/series_schema.rs"
